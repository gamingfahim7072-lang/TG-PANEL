<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="fzDarkBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>

    <!-- Metallic Cyan/Emerald Gradients for F and Z -->
    <linearGradient id="fzPrimaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="fzSecondaryGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="fzGoldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <!-- Bevel & Shadow Filters -->
    <filter id="fzGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="shieldShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#06b6d4" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Squircle App Icon Base -->
  <rect width="512" height="512" rx="116" fill="url(#fzDarkBg)"/>
  <rect width="504" height="504" x="4" y="4" rx="112" fill="none" stroke="url(#fzPrimaryGrad)" stroke-width="3" stroke-opacity="0.35"/>

  <!-- Subtle Financial Security Shield Contour -->
  <path d="M 256 64 L 388 120 C 388 260 256 380 256 448 C 256 380 124 260 124 120 Z" 
        fill="#06b6d4" fill-opacity="0.04" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.2" stroke-dasharray="8 6"/>

  <!-- Core Geometric Interlocking FZ Emblem -->
  <g filter="url(#shieldShadow)" transform="translate(0, -6)">
    <!-- Geometric 'F' Bar 1 (Top Horizontal Bar) -->
    <path d="M 148 152 L 324 152 C 334 152 342 160 342 170 L 342 188 C 342 198 334 206 324 206 L 212 206 L 212 226 L 298 226 C 308 226 316 234 316 244 L 316 262 C 316 272 308 280 298 280 L 212 280 L 212 360 C 212 370 204 378 194 378 L 166 378 C 156 378 148 370 148 360 Z" 
          fill="url(#fzPrimaryGrad)"/>

    <!-- Geometric 'Z' Diagonal & Bottom Base (Interlocking with F) -->
    <path d="M 364 152 L 334 152 L 236 312 L 348 312 C 358 312 366 320 366 330 L 366 348 C 366 358 358 366 348 366 L 222 366 C 212 366 206 356 210 346 L 318 170 L 230 170 L 230 152 L 364 152 Z" 
          fill="url(#fzSecondaryGrad)" opacity="0.95"/>

    <!-- Central Precision Circuit / Node (Representing Instant Transaction Settlement) -->
    <circle cx="270" cy="244" r="14" fill="#070b14" stroke="#38bdf8" stroke-width="4"/>
    <circle cx="270" cy="244" r="6" fill="#10b981"/>

    <!-- Dynamic Flow Arrows / Fintech Vectors -->
    <polygon points="346,244 358,238 358,250" fill="#38bdf8"/>
    <polygon points="174,244 162,238 162,250" fill="#10b981"/>
  </g>

  <!-- Bottom Brand Text Monogram Subtitle -->
  <g transform="translate(256, 432)" text-anchor="middle">
    <text font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="28" fill="#ffffff" letter-spacing="8">FZ PAY</text>
  </g>
</svg>
